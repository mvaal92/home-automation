<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0d" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Hjem" />
    <meta name="apple-mobile-web-app-title" content="Hjem" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>Hjem</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Never leave a black screen: if the app bundle fails to load or crashes before rendering, reload once, then show a message.
      (function () {
        var K = "home.boot.reloaded";
        function fail(why) {
          if (document.getElementById("root").children.length) return;
          if (!sessionStorage.getItem(K)) { sessionStorage.setItem(K, "1"); location.reload(); return; }
          document.getElementById("root").innerHTML = '<div style="font:16px system-ui;padding:48px 24px;color:#888;text-align:center">Hjem lastet ikke (' + String(why).slice(0, 120).replace(/</g, "&lt;") + ').<br><br><button onclick="sessionStorage.removeItem(\'' + K + '\');location.reload()" style="font:inherit;padding:12px 20px;border-radius:12px;border:1px solid #888;background:none;color:inherit">Last inn på nytt</button></div>';
        }
        addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") fail("kunne ikke hente appen"); else setTimeout(function () { fail(e.message || "feil"); }, 50); }, true);
        addEventListener("unhandledrejection", function (e) { setTimeout(function () { fail((e.reason && e.reason.message) || "feil"); }, 50); });
        setTimeout(function () { if (document.getElementById("root").children.length) sessionStorage.removeItem(K); else fail("tidsavbrudd"); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
